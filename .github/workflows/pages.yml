name: Publicar no GitHub Pages

# Publica a app em https://<utilizador>.github.io/missoes-do-nicolas/

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Um deploy de cada vez; não cancela o que já está a correr.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Verificar (lint, tipos e testes)
        run: |
          npm run lint
          npm test

      - name: Construir
        # O caminho base vem do nome do repositório, por isso renomear o
        # repositório não parte a publicação.
        run: |
          export BASE_PATH="/${GITHUB_REPOSITORY#*/}/"
          echo "A construir para $BASE_PATH"
          npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
